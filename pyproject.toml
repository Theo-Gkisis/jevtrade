[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jevtrade"
version = "0.1.0"
description = "Swing trading bot for spot BTC/ETH/SOL with Jev AI as advisor"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4",
    "pandas>=2.2",
    "TA-Lib>=0.6",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
